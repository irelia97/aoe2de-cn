<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猜一把 · 帝国时代 II</title>
  <link rel="stylesheet" href="./style.css?v=14">
  <script src="./data.js?v=24" defer></script>
  <script src="./game.js?v=22" defer></script>
</head>
<body>
  <div class="hero-actions">
    <a href="/">← 返回主界面</a>
    <span>今日游玩人数 <strong id="todayGuessPlayers">—</strong></span>
  </div>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">AGE OF EMPIRES II · 猜谜</div>
      <h1>猜一把</h1>
      <p>从战队、天梯和科技树里找线索。</p>
    </header>
    <section class="board" aria-label="猜谜游戏">
      <div class="toolbar">
        <div class="segment" aria-label="题型">
          <button type="button" data-mode="player" aria-pressed="true">猜选手</button>
          <button type="button" data-mode="civilization" aria-pressed="false">猜民族</button>
        </div>
      </div>
      <div class="round-heading">
        <h2 id="roundTitle"></h2>
        <div class="round-metrics"><span id="attempts"></span><span>用时 <strong id="roundTime">00:00</strong></span></div>
      </div>
      <p id="rules" class="muted"></p>
      <button id="startRound" class="primary" type="button">开始游戏</button>
      <ol id="clues" class="clues" aria-label="已揭晓的民族线索" hidden></ol>
      <form id="guessForm">
        <div class="guess-search">
          <input id="guessInput" type="search" autocomplete="off" list="choices" required>
          <div id="civilizationChoices" class="civilization-choices" role="group" aria-label="民族候选" hidden></div>
        </div>
        <datalist id="choices"></datalist>
        <button class="primary" type="submit">提交猜测</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="roundResult" class="round-result" aria-label="本局成绩" aria-live="polite" hidden>
        <h3 id="roundResultTitle">本局成绩</h3>
        <p id="roundResultSummary"></p>
        <dl>
          <div><dt>猜测次数</dt><dd id="roundResultAttempts"></dd></div>
          <div><dt>总用时</dt><dd id="roundResultTime"></dd></div>
        </dl>
        <div id="answerProfile" class="answer-profile" hidden>
          <h4>谜底资料</h4>
          <dl id="answerProfileFacts"></dl>
          <p id="answerEligibility"></p>
        </div>
      </section>
      <div id="results" class="results" hidden>
        <table>
          <thead id="columns"></thead>
          <tbody id="guesses"></tbody>
        </table>
      </div>
      <div class="round-actions">
        <button id="next" type="button">刷新一题</button>
      </div>
    </section>
    <footer id="source" class="muted"></footer>
  </main>
</body>
</html>
