# Include inside the HTTPS server block. ACME challenges remain allowed.
add_header Strict-Transport-Security "max-age=86400" always;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

if ($host !~* ^(aoe2cn\.cc|www\.aoe2cn\.cc)$) { return 444; }
if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
location ~* ^/(?:server(?:/|\.js$)|tools(?:/|$)|config(?:/|$)|node_modules(?:/|$)|package(?:-lock)?\.json$|cgi-bin(?:/|$)|vendor/phpunit(?:/|$)|wp-admin(?:/|$)|wp-login\.php$|xmlrpc\.php$|phpmyadmin(?:/|$)|actuator(?:/|$)) { return 404; }
location ~* \.(?:env|sql|sqlite3?|db|bak|old|ini|log|pem|key|toml|ya?ml|sh|py|php)(?:/|$) { return 404; }
location ^~ /api/internal/ { return 404; }
location = /api/protection/status { return 404; }
