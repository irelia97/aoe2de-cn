[Definition]
# Match dedicated exploit/secret probes only. Ordinary 404s, crawler visits and
# API quota responses are deliberately excluded to avoid banning shared IPs.
failregex = (?i)^<HOST> \S+ \S+ \[[^\]]*\] "(?:GET|HEAD|POST|PUT|OPTIONS|DELETE|PATCH) /(?:[^" ?]*/)?(?:\.env[^" ?]*|\.git(?:/[^" ?]*)?|cgi-bin(?:/[^" ?]*)?|vendor/phpunit(?:/[^" ?]*)?|wp-admin(?:/[^" ?]*)?|wp-login\.php|xmlrpc\.php|phpmyadmin(?:/[^" ?]*)?)(?:\?[^" ]*)? HTTP/[^" ]+" (?:400|403|404|405|444) \S+
ignoreregex =
